name: vestis-web

services:
  frontend:
    build:
      context: .
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports: ["127.0.0.1:${WEB_PORT:-3000}:80"]
    networks:
      vestis:
        aliases: [vestis_frontend]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

networks:
  vestis:
    external: true
    name: ${VESTIS_NETWORK:-vestis-services}
